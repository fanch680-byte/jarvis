<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. — Assistant Web</title>
<style>
  :root {
    --bg: #07070d; --panel: #0e1220; --panel-2: #131a2c;
    --cyan: #00e5ff; --cyan-dark: #0b6b7d;
    --txt: #c8f6ff; --txt-dim: #5f7d8c;
    --green: #69f0ae; --orange: #ffab40; --red: #ff5370;
    --border: #152034; --hover: #1c2740;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Segoe UI', -apple-system, sans-serif;
    background: var(--bg); color: var(--txt);
    display: flex; overflow: hidden;
  }

  /* ===================== COLONNE GAUCHE ===================== */
  .left {
    width: 340px; background: var(--panel);
    display: flex; flex-direction: column;
    padding: 24px 20px; border-right: 1px solid var(--border);
    overflow-y: auto; flex-shrink: 0;
  }
  .reactor { display: flex; justify-content: center; margin-bottom: 16px; }
  .reactor canvas { filter: drop-shadow(0 0 20px rgba(0,229,255,0.4)); }
  .status {
    text-align: center; font-size: 13px; font-weight: 700;
    letter-spacing: 1px; color: var(--cyan); text-transform: uppercase;
  }
  .sub-status {
    text-align: center; font-size: 11px; color: var(--txt-dim);
    margin-top: 4px; margin-bottom: 22px;
  }
  .btn {
    width: 100%; padding: 12px 16px; border: none; border-radius: 10px;
    font-family: inherit; font-size: 14px; font-weight: 700;
    cursor: pointer; transition: all 0.15s; margin-bottom: 8px;
  }
  .btn-primary { background: var(--cyan-dark); color: #eaffff; letter-spacing: 0.5px; }
  .btn-primary:hover { background: var(--cyan); box-shadow: 0 0 20px rgba(0,229,255,0.4); }
  .btn-primary.listening { background: #8e1b1b; color: #ffe5e5; animation: pulse 1.2s infinite; }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(255,83,112,0.6); }
    50% { box-shadow: 0 0 0 10px rgba(255,83,112,0); }
  }
  .btn-secondary { background: var(--panel-2); color: var(--txt); font-weight: 600; font-size: 12px; }
  .btn-secondary:hover { background: var(--hover); }
  .btn-ghost {
    background: transparent; color: var(--txt-dim);
    border: 1px solid #1e2b3d; font-weight: 500; font-size: 11px;
  }
  .btn-ghost:hover { background: var(--hover); color: var(--txt); }
  .section {
    margin-top: 18px; text-align: center;
    font-family: 'Consolas', monospace; font-size: 10px;
    color: var(--txt-dim); letter-spacing: 1px;
  }
  .theme-bar { display: flex; gap: 6px; margin-top: 8px; }
  .theme-bar .btn { flex: 1; margin: 0; padding: 8px 4px; font-size: 11px; }
  .theme-bar .btn.active { background: var(--cyan-dark); color: #eaffff; }

  /* ===================== COLONNE DROITE ===================== */
  .right { flex: 1; display: flex; flex-direction: column; padding: 20px 26px; min-width: 0; }
  .right h2 {
    font-family: 'Consolas', monospace; font-size: 13px; font-weight: 700;
    color: var(--cyan-dark); margin-bottom: 10px; letter-spacing: 1px;
  }
  .journal {
    flex: 1; background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px; overflow-y: auto;
    font-family: 'Consolas', monospace; font-size: 15px;
    line-height: 1.6; margin-bottom: 12px;
  }
  .journal::-webkit-scrollbar { width: 8px; }
  .journal::-webkit-scrollbar-thumb { background: #1e2b3d; border-radius: 4px; }
  .msg { white-space: pre-wrap; word-break: break-word; }
  .msg.jarvis { color: var(--cyan); }
  .msg.user { color: var(--green); }
  .msg.sys { color: var(--txt-dim); font-size: 13px; }
  .msg.err { color: var(--red); }
  .msg.aide { color: var(--txt); }

  .input-bar { display: flex; gap: 8px; margin-bottom: 10px; }
  .input-bar input {
    flex: 1; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px; color: var(--txt);
    font-family: inherit; font-size: 14px; outline: none;
  }
  .input-bar input:focus { border-color: var(--cyan-dark); box-shadow: 0 0 0 2px rgba(0,229,255,0.1); }
  .input-bar input::placeholder { color: var(--txt-dim); }
  .input-bar button {
    background: var(--cyan-dark); color: #eaffff; border: none;
    border-radius: 10px; padding: 0 24px; font-weight: 700;
    font-size: 13px; cursor: pointer;
  }
  .input-bar button:hover { background: var(--cyan); box-shadow: 0 0 15px rgba(0,229,255,0.3); }

  .quick-bar { display: flex; gap: 8px; flex-wrap: wrap; }
  .quick-bar button {
    background: var(--panel-2); border: 1px solid var(--cyan-dark);
    color: var(--cyan); border-radius: 10px; padding: 10px 16px;
    font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .quick-bar button:hover { background: var(--cyan-dark); color: #eaffff; }
  .quick-bar .right-btn { margin-left: auto; }

  body.light {
    --bg: #eef2f7; --panel: #ffffff; --panel-2: #f1f5f9;
    --cyan: #0077b6; --cyan-dark: #00a8e8;
    --txt: #0b1a2a; --txt-dim: #64748b;
    --green: #1b8a4a; --border: #cbd5e1; --hover: #e2e8f0;
  }

  /* ============================================================
     📱 RESPONSIVE
     ============================================================ */
  @media (max-width: 1024px) {
    .left { width: 280px; padding: 16px 14px; }
    .reactor canvas { width: 160px; height: 160px; }
    .right { padding: 16px; }
    .journal { font-size: 13px; }
  }

  @media (max-width: 768px) {
    body {
      flex-direction: column;
      overflow-y: auto;
      height: auto;
      min-height: 100vh;
      min-height: 100dvh;
    }
    .left {
      width: 100%;
      border-right: none;
      border-bottom: 1px solid var(--border);
      padding: 12px;
      max-height: 55vh;
    }
    .reactor { margin-bottom: 8px; }
    .reactor canvas { width: 100px; height: 100px; }
    .status { font-size: 11px; }
    .sub-status { font-size: 10px; margin-bottom: 10px; }
    .btn { padding: 11px 12px; font-size: 13px; margin-bottom: 6px; }
    .theme-bar .btn { padding: 6px 4px; font-size: 10px; }
    .section { margin-top: 10px; font-size: 9px; }
    .right { padding: 12px; height: auto; }
    .right h2 { font-size: 11px; }
    .journal {
      height: 40vh;
      min-height: 200px;
      max-height: 400px;
      font-size: 13px;
      padding: 12px;
    }
    .input-bar { flex-direction: column; }
    .input-bar input {
      padding: 12px;
      font-size: 16px; /* Empêche le zoom sur iOS */
      width: 100%;
    }
    .input-bar button { padding: 12px; width: 100%; }
    .quick-bar { gap: 6px; }
    .quick-bar button {
      flex: 1;
      min-width: 70px;
      padding: 8px 6px;
      font-size: 11px;
    }
    .quick-bar .right-btn { margin-left: 0; }
  }

  @media (max-width: 480px) {
    .reactor canvas { width: 80px; height: 80px; }
    .journal { min-height: 180px; }
    .quick-bar button { font-size: 10px; padding: 8px 4px; }
  }
</style>
</head>
<body>

<div class="left">
  <div class="reactor">
    <canvas id="reactor" width="200" height="200"></canvas>
  </div>
  <div class="status" id="status">Systèmes en ligne</div>
  <div class="sub-status" id="subStatus">En attente d'une commande</div>

  <button class="btn btn-primary" id="micBtn">🎙  PARLER</button>
  <button class="btn btn-secondary" id="contBtn">◉  ÉCOUTE CONTINUE</button>

  <div class="section">── THÈME ──</div>
  <div class="theme-bar">
    <button class="btn btn-ghost active" data-theme="dark">🌙 Sombre</button>
    <button class="btn btn-ghost" data-theme="light">☀ Clair</button>
  </div>

  <div class="section">── AIDE ──</div>
  <button class="btn btn-ghost" id="helpBtn">❓ COMMANDES</button>

  <div style="margin-top: auto; text-align: center; font-size: 10px; color: #2e3f4d; padding-top: 20px;">
    JARVIS v2.0 • HTML + JS • Responsive
  </div>
</div>

<div class="right">
  <h2>◤  JOURNAL SYSTÈME</h2>
  <div class="journal" id="journal"></div>

  <div class="input-bar">
    <input type="text" id="cmdInput"
           placeholder="Commande… (ex : ouvre google, appelle Paul, quelle heure ?)">
    <button id="sendBtn">ENVOYER</button>
  </div>

  <div class="quick-bar">
    <button id="btnGoogle">🔎 GOOGLE</button>
    <button id="btnYouTube">▶ YOUTUBE</button>
    <button id="btnCall">📞 APPEL</button>
    <button id="btnSMS">💬 SMS</button>
    <button id="btnClear" class="right-btn">🗑 EFFACER</button>
  </div>
</div>

<script>
/* ============================================================
   📋 COMMANDES JARVIS
   ============================================================ */
const COMMANDES_JARVIS = {
  "jarvis_version": "2.0",
  "utilisateur": "Monsieur",
  "categories": {
    "salutations": {
      "nom": "Salutations", "icone": "🎙",
      "commandes": [
        { "declencheurs": ["bonjour", "salut", "bonsoir"], "exemple": "Bonjour" },
        { "declencheurs": ["merci"], "exemple": "Merci" },
        { "declencheurs": ["au revoir", "bye"], "exemple": "Au revoir" }
      ]
    },
    "informations": {
      "nom": "Informations", "icone": "🕐",
      "commandes": [
        { "declencheurs": ["heure"], "exemple": "Quelle heure est-il ?" },
        { "declencheurs": ["date", "quel jour"], "exemple": "Quelle est la date ?" }
      ]
    },
    "sites_web": {
      "nom": "Sites web", "icone": "🌐",
      "formules": "ouvre / va sur",
      "exemples": ["Ouvre Google", "Ouvre YouTube", "Ouvre Gmail", "Ouvre Wikipedia",
                   "Ouvre GitHub", "Ouvre Netflix", "Ouvre Twitch", "Ouvre Amazon",
                   "Ouvre ChatGPT", "Va sur Google"]
    },
    "mobile": {
      "nom": "Téléphone (mobile)", "icone": "📱",
      "exemples": [
        "Appelle Paul",
        "Envoie un SMS à Marie",
        "Envoie un mail à Jean",
        "Ouvre WhatsApp",
        "Ouvre Instagram",
        "Ouvre Spotify"
      ]
    },
    "recherches_web": {
      "nom": "Recherches web", "icone": "🔎",
      "exemples": ["Cherche sur Google python", "Cherche sur YouTube lofi"]
    },
    "calculs": {
      "nom": "Calculs", "icone": "🧮",
      "formules": "calcule / combien fait",
      "exemples": ["Calcule 5 plus 3", "Combien fait 10 fois 4 ?"]
    },
    "themes": {
      "nom": "Thèmes", "icone": "🎨",
      "exemples": ["Thème clair", "Thème sombre"]
    },
    "divers": {
      "nom": "Divers", "icone": "😄",
      "exemples": ["Blague", "Aide"]
    }
  },
  "mode_utilisation": {
    "bouton_parler": "Clique puis dis ta commande directement",
    "ecoute_continue": "Dis « Jarvis » puis ta commande",
    "texte": "Tape dans la barre du bas puis Entrée"
  }
};

/* ============================================================
   📱 CONTACTS (à personnaliser !)
   ============================================================ */
const CONTACTS = {
  "paul": { "tel": "+33612345678", "email": "paul@example.com" },
  "marie": { "tel": "+33687654321", "email": "marie@example.com" },
  "jean": { "tel": "+33611112222", "email": "jean@example.com" },
  "papa": { "tel": "+33633334444", "email": "papa@example.com" },
  "maman": { "tel": "+33655556666", "email": "maman@example.com" }
};

/* ============================================================
   ARC REACTOR
   ============================================================ */
const canvas = document.getElementById('reactor');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const CX = W / 2, CY = H / 2;
let energy = 0.3, targetEnergy = 0.3;
let rings = [
  { r: 90, w: 5, extent: 1.9, speed: 2.2, angle: Math.random() * Math.PI * 2, color: '#00e5ff' },
  { r: 75, w: 3, extent: 1.2, speed: -3.0, angle: Math.random() * Math.PI * 2, color: '#00b8d4' },
  { r: 60, w: 3, extent: 2.6, speed: 1.6, angle: Math.random() * Math.PI * 2, color: '#18ffff' },
  { r: 48, w: 2, extent: 0.7, speed: -4.5, angle: Math.random() * Math.PI * 2, color: '#0091ea' },
];
function hexToRgb(h) {
  return { r: parseInt(h.slice(1,3),16), g: parseInt(h.slice(3,5),16), b: parseInt(h.slice(5,7),16) };
}
function lerpColor(c1, c2, k) {
  k = Math.max(0, Math.min(1, k));
  const a = hexToRgb(c1), b = hexToRgb(c2);
  return `rgb(${Math.round(a.r+(b.r-a.r)*k)},${Math.round(a.g+(b.g-a.g)*k)},${Math.round(a.b+(b.b-a.b)*k)})`;
}
function drawReactor() {
  ctx.clearRect(0, 0, W, H);
  energy += (targetEnergy - energy) * 0.08;
  ctx.strokeStyle = '#0d2b36'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(CX, CY, 96, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = '#0a1c24'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(CX, CY, 87, 0, Math.PI * 2); ctx.stroke();
  rings.forEach(ring => {
    ring.angle += ring.speed * (0.6 + energy * 2.4) * 0.02;
    ctx.strokeStyle = ring.color; ctx.lineWidth = ring.w;
    ctx.beginPath(); ctx.arc(CX, CY, ring.r, ring.angle, ring.angle + ring.extent); ctx.stroke();
  });
  const t = Date.now() / 1000;
  const pulse = 0.5 + 0.5 * Math.sin(t * (2 + energy * 6));
  const r = 24 * (0.85 + 0.25 * pulse) * (0.75 + 0.6 * energy);
  const glow = ctx.createRadialGradient(CX, CY, 0, CX, CY, r * 2);
  glow.addColorStop(0, `rgba(0,229,255,${0.25 * pulse})`);
  glow.addColorStop(1, 'rgba(0,229,255,0)');
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(CX, CY, r * 2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = lerpColor('#0b6b7d', '#00e5ff', pulse);
  ctx.beginPath(); ctx.arc(CX, CY, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = lerpColor('#26c6da', '#ffffff', pulse);
  ctx.beginPath(); ctx.arc(CX, CY, r * 0.45, 0, Math.PI * 2); ctx.fill();
  requestAnimationFrame(drawReactor);
}
drawReactor();
function setEnergy(v) { targetEnergy = Math.max(0.15, Math.min(1.0, v)); }

/* ============================================================
   VOIX
   ============================================================ */
let frenchVoice = null;
function loadVoices() {
  const voices = speechSynthesis.getVoices();
  frenchVoice = voices.find(v => v.lang.startsWith('fr')) || voices[0];
}
speechSynthesis.onvoiceschanged = loadVoices;
setTimeout(loadVoices, 300);
function parler(texte) {
  if (!texte) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(texte);
  u.lang = 'fr-FR'; u.rate = 1.0; u.pitch = 1.0;
  if (frenchVoice) u.voice = frenchVoice;
  speechSynthesis.speak(u);
}

/* ============================================================
   JOURNAL
   ============================================================ */
const journal = document.getElementById('journal');
function log(type, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + type;
  div.textContent = text;
  journal.appendChild(div);
  journal.scrollTop = journal.scrollHeight;
}
function dire(texte) {
  log('jarvis', 'JARVIS › ' + texte);
  parler(texte);
}

/* ============================================================
   UI
   ============================================================ */
const statusEl = document.getElementById('status');
const subStatusEl = document.getElementById('subStatus');
const micBtn = document.getElementById('micBtn');
const contBtn = document.getElementById('contBtn');
const cmdInput = document.getElementById('cmdInput');
let listening = false, continuous = false, recognition = null;
function setStatus(text, color) { statusEl.textContent = text; statusEl.style.color = color || 'var(--cyan)'; }
function setSubStatus(text) { subStatusEl.textContent = text; }

/* ============================================================
   RECONNAISSANCE VOCALE
   ============================================================ */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  recognition = new SR();
  recognition.lang = 'fr-FR';
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.onresult = (event) => {
    const texte = event.results[0][0].transcript;
    log('user', 'Vous › ' + texte);
    processCommand(texte);
  };
  recognition.onerror = (e) => {
    console.error('[MICRO]', e.error);
    if (e.error === 'not-allowed') dire("Veuillez autoriser l'accès au microphone.");
  };
  recognition.onend = () => {
    listening = false;
    micBtn.classList.remove('listening');
    micBtn.textContent = '🎙  PARLER';
    if (continuous) setTimeout(startListening, 500);
    else { setStatus('Systèmes en ligne', 'var(--cyan)'); setSubStatus("En attente d'une commande"); }
  };
} else {
  micBtn.disabled = true;
  micBtn.textContent = '🎙  Non supporté';
}
function startListening() {
  if (!recognition || listening) return;
  listening = true;
  micBtn.classList.add('listening');
  micBtn.textContent = '⏹  ÉCOUTE...';
  setStatus('● ÉCOUTE EN COURS…');
  setSubStatus('Parlez maintenant');
  setEnergy(1.0);
  try { recognition.start(); } catch (e) { console.error(e); }
}
micBtn.onclick = () => { if (listening) recognition.stop(); else startListening(); };
contBtn.onclick = () => {
  continuous = !continuous;
  if (continuous) {
    contBtn.textContent = '■  STOPPER';
    contBtn.style.background = '#8e1b1b';
    contBtn.style.color = '#ffe5e5';
    setSubStatus('Dites « Jarvis … »');
    startListening();
  } else {
    contBtn.textContent = '◉  ÉCOUTE CONTINUE';
    contBtn.style.background = '';
    contBtn.style.color = '';
    if (recognition) recognition.stop();
  }
};

/* ============================================================
   📱 FONCTIONS MOBILES
   ============================================================ */
function estMobile() {
  return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
}

function appelerContact(nom) {
  const contact = CONTACTS[nom.toLowerCase()];
  if (!contact || !contact.tel) {
    dire(`Désolé Monsieur, je n'ai pas le numéro de ${nom} dans mes contacts.`);
    return;
  }
  window.location.href = `tel:${contact.tel}`;
  dire(`Oui Monsieur, j'appelle ${nom}.`);
}

function envoyerSMS(nom) {
  const contact = CONTACTS[nom.toLowerCase()];
  if (!contact || !contact.tel) {
    dire(`Désolé Monsieur, je n'ai pas le numéro de ${nom}.`);
    return;
  }
  window.location.href = `sms:${contact.tel}`;
  dire(`Oui Monsieur, j'ouvre les SMS pour ${nom}.`);
}

function envoyerMail(nom) {
  const contact = CONTACTS[nom.toLowerCase()];
  if (!contact || !contact.email) {
    dire(`Désolé Monsieur, je n'ai pas l'email de ${nom}.`);
    return;
  }
  window.location.href = `mailto:${contact.email}`;
  dire(`Oui Monsieur, j'ouvre le mail pour ${nom}.`);
}

function ouvrirApp(nom) {
  // Apps Android (intent://)
  const appsAndroid = {
    whatsapp: { pkg: 'com.whatsapp', fallback: 'https://wa.me/' },
    instagram: { pkg: 'com.instagram.android', fallback: 'https://instagram.com' },
    facebook: { pkg: 'com.facebook.katana', fallback: 'https://facebook.com' },
    spotify: { pkg: 'com.spotify.music', fallback: 'https://open.spotify.com' },
    youtube: { pkg: 'com.google.android.youtube', fallback: 'https://youtube.com' },
    gmail: { pkg: 'com.google.android.gm', fallback: 'https://mail.google.com' },
    maps: { pkg: 'com.google.android.apps.maps', fallback: 'https://maps.google.com' },
    telephone: { pkg: 'com.android.dialer', fallback: 'tel:' },
    messages: { pkg: 'com.google.android.apps.messaging', fallback: 'sms:' },
    appareil_photo: { pkg: 'com.android.camera', fallback: '' },
    chrome: { pkg: 'com.android.chrome', fallback: 'https://google.com' }
  };

  const app = appsAndroid[nom.toLowerCase()];
  if (!app) {
    dire(`Je ne connais pas l'application ${nom}, Monsieur.`);
    return;
  }

  if (estMobile() && /Android/i.test(navigator.userAgent)) {
    // Tentative d'ouverture de l'app native
    const intentUrl = `intent://#Intent;package=${app.pkg};end`;
    window.location.href = intentUrl;
    setTimeout(() => {
      if (app.fallback) window.location.href = app.fallback;
    }, 1500);
    dire(`Oui Monsieur, j'ouvre ${nom}.`);
  } else if (app.fallback) {
    // Desktop ou iOS : ouvre la version web
    window.open(app.fallback, '_blank');
    dire(`Oui Monsieur, j'ouvre la version web de ${nom}.`);
  } else {
    dire(`Désolé Monsieur, ${nom} ne peut pas s'ouvrir sur cet appareil.`);
  }
}

/* ============================================================
   MOTEUR DE COMMANDES
   ============================================================ */
function normaliser(texte) {
  return texte.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^\w\s]/g, ' ')
    .replace(/\s+/g, ' ').trim();
}
function choice(a) { return a[Math.floor(Math.random() * a.length)]; }

function processCommand(raw) {
  const req = normaliser(raw);
  console.log('[REQ]', req);
  setEnergy(0.9);
  if (continuous && !req.includes('jarvis')) {
    setTimeout(() => setEnergy(0.3), 300);
    return;
  }
  const cmd = continuous ? req.replace('jarvis', '').trim() : req;
  setTimeout(() => {
    repondre(cmd, raw);
    setEnergy(0.3);
    setStatus('Systèmes en ligne', 'var(--cyan)');
    setSubStatus("En attente d'une commande");
  }, 100);
}

function repondre(req, raw) {
  // ----- Aide -----
  if (req.includes('aide') || req.includes('help') || req === 'commande' || req === 'commandes') {
    afficherAide(); return;
  }

  // ----- Thème -----
  if (req.includes('theme clair') || req.includes('mode clair')) {
    document.body.classList.add('light'); setActiveTheme('light');
    dire("Oui Monsieur, thème clair activé."); return;
  }
  if (req.includes('theme sombre') || req.includes('mode sombre')) {
    document.body.classList.remove('light'); setActiveTheme('dark');
    dire("Oui Monsieur, thème sombre activé."); return;
  }

  // ----- 📱 Appeler -----
  const appelMatch = req.match(/(?:appelle|appeler|appel)\s+([a-z]+)/);
  if (appelMatch) { appelerContact(appelMatch[1]); return; }

  // ----- 📱 SMS -----
  const smsMatch = req.match(/(?:envoie|envoyer)\s+(?:un\s+)?(?:sms|message)\s+(?:a|à)\s+([a-z]+)/);
  if (smsMatch) { envoyerSMS(smsMatch[1]); return; }

  // ----- 📱 Mail -----
  const mailMatch = req.match(/(?:envoie|envoyer)\s+(?:un\s+)?(?:mail|courriel|email)\s+(?:a|à)\s+([a-z]+)/);
  if (mailMatch) { envoyerMail(mailMatch[1]); return; }

  // ----- 📱 Ouvrir app native -----
  const appMatch = req.match(/(?:ouvre|ouvrir|lance)\s+(whatsapp|instagram|facebook|spotify|youtube|gmail|maps|telephone|messages|chrome)/);
  if (appMatch) { ouvrirApp(appMatch[1]); return; }

  // ----- Salutations -----
  if (/\b(bonjour|salut|bonsoir|hello|coucou)\b/.test(req)) {
    dire(choice(["Bonjour Monsieur. Que puis-je faire pour vous ?",
                 "Salutations Monsieur. Je suis à votre disposition.",
                 "Bonjour Monsieur. Tous les systèmes sont opérationnels."]));
    return;
  }

  // ----- Heure / Date -----
  if (req.includes('heure')) {
    const h = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    dire(`Il est ${h}, Monsieur.`); return;
  }
  if (req.includes('date') || req.includes('quel jour')) {
    const d = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    dire(`Nous sommes le ${d}, Monsieur.`); return;
  }
  if (req.includes('qui es tu') || req.includes('ton nom')) {
    dire("Je suis JARVIS, votre assistant personnel."); return;
  }

  // ----- Sites web -----
  const sites = {
    google: 'https://www.google.com', youtube: 'https://www.youtube.com',
    gmail: 'https://mail.google.com', wikipedia: 'https://fr.wikipedia.org',
    github: 'https://github.com', facebook: 'https://www.facebook.com',
    twitter: 'https://twitter.com', chatgpt: 'https://chat.openai.com',
    netflix: 'https://www.netflix.com', twitch: 'https://www.twitch.tv',
    amazon: 'https://www.amazon.fr'
  };
  for (const [site, url] of Object.entries(sites)) {
    if (req.includes('ouvre ' + site) || req.includes('ouvrir ' + site) || req.includes('va sur ' + site)) {
      window.open(url, '_blank');
      dire(`Oui Monsieur, j'ouvre ${site}.`); return;
    }
  }

  // ----- Recherche Google -----
  if (req.includes('cherche sur google') || req.startsWith('google ')) {
    const t = req.replace(/.*?(?:google)\s*/, '').trim();
    if (t) {
      window.open('https://www.google.com/search?q=' + encodeURIComponent(t), '_blank');
      dire(`Oui Monsieur, voici votre recherche Google sur ${t}.`);
    } else dire("Que voulez-vous que je cherche sur Google, Monsieur ?");
    return;
  }

  // ----- Recherche YouTube -----
  if (req.includes('cherche sur youtube') || req.startsWith('youtube ') || req.includes('sur youtube')) {
    const t = req.replace(/.*?(?:youtube)\s*/, '').trim();
    if (t) {
      window.open('https://www.youtube.com/results?search_query=' + encodeURIComponent(t), '_blank');
      dire(`Oui Monsieur, je cherche ${t} sur YouTube.`);
    } else dire("Que voulez-vous que je cherche sur YouTube, Monsieur ?");
    return;
  }

  // ----- Calcul -----
  const cm = req.match(/(?:calcule|combien fait|combien font)\s+(.+)/);
  if (cm) {
    let expr = cm[1].replace(/plus/g, '+').replace(/moins/g, '-')
      .replace(/fois/g, '*').replace(/divise par|sur/g, '/')
      .replace(/x/g, '*').replace(/,/g, '.');
    if (/^[0-9+\-*/(). ]+$/.test(expr)) {
      try { dire(`Le résultat est ${Function('"use strict";return (' + expr + ')')()}, Monsieur.`); }
      catch { dire("Cette expression est invalide, Monsieur."); }
    } else dire("Je ne peux calculer que des expressions arithmétiques, Monsieur.");
    return;
  }

  // ----- Blague -----
  if (req.includes('blague') || req.includes('fais moi rire')) {
    dire(choice([
      "Pourquoi les développeurs préfèrent-ils le noir ? Parce que light attire les bugs.",
      "Il y a 10 types de personnes : celles qui comprennent le binaire, et celles qui ne le comprennent pas."
    ])); return;
  }

  if (req.includes('merci')) {
    dire(choice(["Je vous en prie, Monsieur.", "À votre service, Monsieur.", "C'est un plaisir, Monsieur."]));
    return;
  }
  if (/\b(au revoir|a plus|bye|bonne nuit)\b/.test(req)) {
    dire("Au revoir Monsieur. Je reste en veille."); return;
  }

  dire(choice([
    "Pardon Monsieur, je n'ai pas bien saisi. Reformulez, s'il vous plaît.",
    "Désolé Monsieur, cette instruction ne figure pas dans mes protocoles.",
    "Pouvez-vous préciser votre demande, Monsieur ?"
  ]));
}

/* ============================================================
   AIDE
   ============================================================ */
function afficherAide() {
  log('sys', '');
  log('aide', '══════════════════════════════════════════');
  log('aide', '         COMMANDES JARVIS');
  log('aide', '══════════════════════════════════════════');
  log('sys', '');
  for (const key in COMMANDES_JARVIS.categories) {
    const cat = COMMANDES_JARVIS.categories[key];
    log('aide', `${cat.icone}  ${cat.nom.toUpperCase()}`);
    if (cat.formules) log('sys', `   Formules : ${cat.formules}`);
    if (cat.commandes) {
      for (const cmd of cat.commandes) {
        if (cmd.declencheurs) log('sys', `   • ${cmd.declencheurs.slice(0,4).join(' / ')}`);
      }
    }
    if (cat.exemples) {
      for (const ex of cat.exemples) log('sys', `   • ${ex}`);
    }
    log('sys', '');
  }
  log('aide', '──────────────────────────────────────────');
  log('aide', 'COMMENT PARLER À JARVIS');
  log('aide', '──────────────────────────────────────────');
  for (const k in COMMANDES_JARVIS.mode_utilisation) log('sys', `   • ${COMMANDES_JARVIS.mode_utilisation[k]}`);
  log('aide', '══════════════════════════════════════════');
  log('sys', '');
  dire("Oui Monsieur, voici la liste complète des commandes.");
}

/* ============================================================
   INTERFACE
   ============================================================ */
document.getElementById('sendBtn').onclick = envoyer;
cmdInput.addEventListener('keydown', e => { if (e.key === 'Enter') envoyer(); });
function envoyer() {
  const t = cmdInput.value.trim();
  if (!t) return;
  cmdInput.value = '';
  log('user', 'Vous › ' + t);
  processCommand(t);
}
document.getElementById('btnGoogle').onclick = () => {
  const t = cmdInput.value.trim();
  if (t) {
    window.open('https://www.google.com/search?q=' + encodeURIComponent(t), '_blank');
    log('user', 'Vous › ' + t);
    dire(`Recherche Google sur ${t}.`);
    cmdInput.value = '';
  } else dire("Tapez quelque chose d'abord, Monsieur.");
};
document.getElementById('btnYouTube').onclick = () => {
  const t = cmdInput.value.trim();
  if (t) {
    window.open('https://www.youtube.com/results?search_query=' + encodeURIComponent(t), '_blank');
    log('user', 'Vous › ' + t);
    dire(`Recherche YouTube sur ${t}.`);
    cmdInput.value = '';
  } else dire("Tapez quelque chose d'abord, Monsieur.");
};
document.getElementById('btnCall').onclick = () => {
  const t = cmdInput.value.trim();
  if (t) { appelerContact(t.toLowerCase()); cmdInput.value = ''; }
  else dire("Qui voulez-vous appeler ? Tapez le nom d'abord.");
};
document.getElementById('btnSMS').onclick = () => {
  const t = cmdInput.value.trim();
  if (t) { envoyerSMS(t.toLowerCase()); cmdInput.value = ''; }
  else dire("À qui voulez-vous envoyer un SMS ? Tapez le nom d'abord.");
};
document.getElementById('btnClear').onclick = () => {
  journal.innerHTML = '';
  log('sys', '— Journal effacé —');
};
document.getElementById('helpBtn').onclick = afficherAide;

/* ============================================================
   THÈME
   ============================================================ */
document.querySelectorAll('.theme-bar button').forEach(btn => {
  btn.onclick = () => {
    const theme = btn.dataset.theme;
    if (theme === 'light') document.body.classList.add('light');
    else document.body.classList.remove('light');
    setActiveTheme(theme);
  };
});
function setActiveTheme(theme) {
  document.querySelectorAll('.theme-bar button').forEach(b => {
    b.classList.toggle('active', b.dataset.theme === theme);
  });
}
